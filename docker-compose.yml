version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: medguide
      POSTGRES_PASSWORD: medguide
      POSTGRES_DB: medguide
    ports:
      - "5432:5432"
    volumes:
      - medguide-db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app

  web-app:
    build: ./apps/web-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin-dashboard:
    build: ./apps/admin-dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  medguide-db-data:
